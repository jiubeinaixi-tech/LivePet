name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Download Gradle 8.2 (mirror)
      run: |
        set +e
        mkdir -p "$HOME/gradle"
        for i in 1 2 3 4 5; do
          echo "attempt $i: downloading from aliyun mirror"
          curl -fsSL --retry 3 --retry-delay 5 \
            https://mirrors.aliyun.com/gradle/gradle-8.2-bin.zip \
            -o "$HOME/gradle/gradle.zip" && break
          echo "attempt $i failed, retrying..."
          sleep 5
        done
        if [ ! -s "$HOME/gradle/gradle.zip" ]; then
          echo "fallback to services.gradle.org"
          curl -fsSL --retry 5 --retry-delay 5 \
            https://services.gradle.org/distributions/gradle-8.2-bin.zip \
            -o "$HOME/gradle/gradle.zip" || exit 1
        fi
        unzip -q "$HOME/gradle/gradle.zip" -d "$HOME/gradle/"
        echo "$HOME/gradle/gradle-8.2/bin" >> "$GITHUB_PATH"
        gradle --version
    - name: Build with Gradle
      run: gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: livepet-debug-apk
        path: app/build/outputs/apk/debug/*.apk